services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      - PASTA_SAIDA=/app/arquivos
      - PASTA_DADOS=/app/dados
      - PASTA_UPLOADS=/app/uploads
      - MAX_UPLOAD_MB=25
      - MAX_WORKERS=4
      - TZ=America/Sao_Paulo
    volumes:
      - arquivos:/app/arquivos          # relatórios gerados pelos robôs
      - ./dados:/app/dados:ro           # base padrão opcional (orcamento.xlsx)
      - uploads:/app/uploads            # planilhas enviadas pelo usuário no chat
      # DEV: código dos robôs sem rebuild (basta docker compose restart backend)
      - ./backend/robos:/app/robos:ro
      - ./backend/app.py:/app/app.py:ro
    expose:
      - "8000"                          # não exposto na máquina host: só o nginx acessa
    networks: [caio-net]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"                     # http://localhost:8080
    volumes:
      # DEV: front sem rebuild (salvar o arquivo + Ctrl+Shift+R já basta)
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/style.css:/usr/share/nginx/html/style.css:ro
      - ./frontend/script.js:/usr/share/nginx/html/script.js:ro
      - ./frontend/robos.js:/usr/share/nginx/html/robos.js:ro
    networks: [caio-net]

volumes:
  arquivos:
  uploads:

networks:
  caio-net:
    driver: bridge